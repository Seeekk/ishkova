<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Корзина | Porsche</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; color: #222; }
    h1 { color: #1976d2; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; vertical-align: middle; }
    img { width: 80px; vertical-align: middle; border-radius: 6px; }
    button {
      padding: 8px 16px;
      background-color: #1976d2;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #a30000;
    }
    #empty-msg { font-size: 1.2em; color: #555; margin-top: 20px; }
    #cart-total { margin-top: 20px; font-weight: bold; font-size: 1.2em; }

    #order-form-container {
      margin-top: 30px;
      background: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      max-width: 600px;
    }
    #order-form-container h2 {
      color: #d60000;
      margin-bottom: 20px;
    }
    form label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    form input, form textarea {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      box-sizing: border-box;
      resize: vertical;
    }
    form textarea {
      min-height: 80px;
    }
    form button.submit-btn {
      background-color: #d60000;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    form button.submit-btn:hover {
      background-color: #a30000;
    }
    #order-success {
      margin-top: 20px;
      color: green;
      font-weight: 700;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Корзина Предзаказа</h1> 
  <div id="cart-container"></div>
  <div id="cart-total"></div>

  <button id="order-btn" style="margin-top: 25px;">Оформить предзаказ</button>

  <div id="order-form-container" style="display:none;">
    <h2>Форма оформления предзаказа</h2>
    <form id="order-form">
      <label for="name">Имя *</label>
      <input type="text" id="name" name="name" required />

      <label for="phone">Телефон *</label>
      <input type="tel" id="phone" name="phone" required pattern="[\d\s\+\-\(\)]{7,}" placeholder="+7 (999) 123-45-67" />

      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required placeholder="example@mail.com" />

      <label for="comment">Комментарий</label>
      <textarea id="comment" name="comment" placeholder="Дополнительная информация..."></textarea>

      <button type="submit" class="submit-btn">Отправить предзаказ</button>
    </form>
    <div id="order-success" role="alert" aria-live="polite"></div>
  </div>

  <script>
   
    function getCart() {
      const cart = localStorage.getItem('porscheCart');
      return cart ? JSON.parse(cart) : [];
    }

    function saveCart(cart) {
      localStorage.setItem('porscheCart', JSON.stringify(cart));
    }

 
    function removeFromCart(id) {
      let cart = getCart();
      cart = cart.filter(item => item.id !== id);
      saveCart(cart);
      renderCart();
    }

 
    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-container');
      const totalDiv = document.getElementById('cart-total');

      if (cart.length === 0) {
        container.innerHTML = '<p id="empty-msg">Корзина пуста.</p>';
        totalDiv.textContent = '';
        document.getElementById('order-btn').disabled = true;
        return;
      }

      let html = '<table><thead><tr><th>Модель</th><th>Цена</th><th>Действия</th></tr></thead><tbody>';
      let total = 0;

      for (const car of cart) {
        html += `<tr>
          <td><img src="./image/${car.image}" alt="${car.title}"> ${car.title}</td>
          <td>$${car.price.toLocaleString()}</td>
          <td><button onclick="removeFromCart(${car.id})">Удалить</button></td>
        </tr>`;
        total += car.price;
      }

      html += '</tbody></table>';
      container.innerHTML = html;
      totalDiv.textContent = `Итого: $${total.toLocaleString()}`;
      document.getElementById('order-btn').disabled = false;
    }

    renderCart();

   
    const orderBtn = document.getElementById('order-btn');
    const orderFormContainer = document.getElementById('order-form-container');
    const orderForm = document.getElementById('order-form');
    const orderSuccess = document.getElementById('order-success');

    orderBtn.addEventListener('click', () => {
      orderFormContainer.style.display = 'block';
      orderBtn.scrollIntoView({behavior: "smooth", block: "center"});
      orderFormContainer.scrollIntoView({behavior: "smooth"});
    });

    orderForm.addEventListener('submit', (e) => {
      e.preventDefault();

  
      if (!orderForm.checkValidity()) {
        orderForm.reportValidity();
        return;
      }


      localStorage.removeItem('porscheCart');
      renderCart();

      orderForm.reset();
      orderSuccess.textContent = 'Спасибо! Ваш предзаказ успешно оформлен. Наш менеджер свяжется с вами в ближайшее время.';
      orderFormContainer.scrollIntoView({behavior: "smooth"});

      setTimeout(() => {
        orderFormContainer.style.display = 'none';
        orderSuccess.textContent = '';
      }, 10000);
    });
    function renderCart() {
  const cart = getCart();
  const container = document.getElementById('cart-container');
  const totalDiv = document.getElementById('cart-total');

  if (cart.length === 0) {
    container.innerHTML = '<p id="empty-msg">Корзина пуста.</p>';
    totalDiv.textContent = '';
    document.getElementById('order-btn').disabled = true;
    return;
  }

  let html = '<table><thead><tr><th>Модель</th><th>Цена</th><th>Количество</th><th>Действия</th></tr></thead><tbody>';
  let total = 0;
  let totalQuantity = 0;

  for (const car of cart) {
    html += `<tr>
      <td><img src="./image/${car.image}" alt="${car.title}"> ${car.title}</td>
      <td>$${car.price.toLocaleString()}</td>
      <td>
        <input type="number" min="1" max="20" value="${car.quantity || 1}" 
          onchange="updateQuantity(${car.id}, this.value)" style="width:60px;"/>
      </td>
      <td><button onclick="removeFromCart(${car.id})">Удалить</button></td>
    </tr>`;
    total += car.price * (car.quantity || 1);
    totalQuantity += (car.quantity || 1);
  }

  html += '</tbody></table>';
  container.innerHTML = html;
  totalDiv.textContent = `Итого: $${total.toLocaleString()}`;

  document.getElementById('order-btn').disabled = totalQuantity === 0;
}

function updateQuantity(id, value) {
  let cart = getCart();
  value = parseInt(value);
  if (isNaN(value) || value < 1) value = 1;
  if (value > 20) value = 20;

  let totalQuantity = 0;
  for (const item of cart) {
    if (item.id === id) {
      totalQuantity += value;
    } else {
      totalQuantity += item.quantity || 1;
    }
  }

  if (totalQuantity > 50) {
    alert('Товар закончился.');
   
    let otherQuantity = totalQuantity - value;
    value = 50 - otherQuantity;
    if (value < 1) value = 1;
  }

  cart = cart.map(item => {
    if (item.id === id) {
      return {...item, quantity: value};
    }
    return item;
  });

  saveCart(cart);
  renderCart();
}

  </script>
</body>
</html>
