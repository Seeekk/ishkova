<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Контакты</title>
  <link rel="stylesheet" href="contacts.css">
</head>
<body>
  <div class="contact-container">
    <div class="contact-info">
      <h2>Контактная информация</h2>
      <p><span>Адрес:</span> Smolensky Lane, 5/3, Tver, Russia</p>
      <p><span>Телефон:</span> +7 (495) 123-45-67</p>
      <p><span>Email:</span> boxcarsofficial@gmail.com</p>
      <p><span>Время работы:</span> Mn-Fr 9:00 - 19:00</p>
    </div>
    <div class="contact-form">
      <h2>Свяжитесь с нами</h2>
      <form action="#" method="post">
        <label for="name">Имя</label>
        <input type="text" id="name" name="name" placeholder="Ваше имя" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Ваш email" required />

        <label for="message">Сообщение</label>
        <textarea id="message" name="message" placeholder="Ваше сообщение" required></textarea>

        <button type="submit">Отправить</button>
      </form>
    </div>
  </div>
</body>
</html>
